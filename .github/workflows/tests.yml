name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  mechanics:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - name: Compile
        run: python -m compileall -q arash_unified_ai_quant.py run_research.py tests examples
      - name: Test mechanics
        run: python tests/test_engine.py
