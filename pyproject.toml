[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arash-unified-ai-quant"
version = "1.0.0"
description = "Leakage-aware multi-market setup evaluation with purged walk-forward machine learning"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Seyed Arash Yousefi"}
]
license = {file = "LICENSE"}
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0,<4",
  "scikit-learn>=1.3,<2",
  "joblib>=1.3,<2",
]

[project.scripts]
arash-quant = "run_research:main"

[tool.setuptools]
py-modules = ["arash_unified_ai_quant", "run_research"]
